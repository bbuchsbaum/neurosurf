# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  workflow_dispatch:
  push:
    branches: [main, master, 'cran/**']
  pull_request:
    branches: [main, master]

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Render rgl/OpenGL output without a display in headless CI.
      RGL_USE_NULL: TRUE

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        if: matrix.config.os != 'ubuntu-latest' || matrix.config.r != 'release'
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      - name: Build and audit the CRAN source tarball
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        shell: bash
        run: |
          R CMD build . --no-manual
          python3 tools/check-cran-payload.py neurosurf_*.tar.gz > cran-payload.json
          cat cran-payload.json

      - name: Check the audited source tarball
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        shell: Rscript {0}
        run: |
          source_tarball <- list.files(pattern = "^neurosurf_.*[.]tar[.]gz$")
          stopifnot(length(source_tarball) == 1L)
          rcmdcheck::rcmdcheck(source_tarball, args = c("--as-cran", "--no-manual"),
                              error_on = "warning", check_dir = "check")

      - uses: actions/upload-artifact@v4
        if: always() && matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        with:
          name: cran-source-${{ github.sha }}
          path: |
            neurosurf_*.tar.gz
            cran-payload.json
            check
          retention-days: 30
